services:
  app:
    build: ./app
    ports:
      - "8080:8080"          # host:container
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    networks:
      - backend

  redis:
    image: redis:7-alpine
    networks:
      - backend

networks:
  backend:
    driver: bridge
